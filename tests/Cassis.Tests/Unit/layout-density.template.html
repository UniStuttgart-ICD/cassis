<!DOCTYPE html>
<html><head><meta charset=utf-8><title>LCRL density scrubber</title>
<style>
body{margin:0;background:#f4f2ee;font-family:Consolas,ui-monospace,monospace;color:#222}
#bar{position:sticky;top:0;z-index:2;background:#f4f2ee;border-bottom:1px solid #ccc;padding:10px 14px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
#bar label{display:flex;align-items:center;gap:8px;font-size:13px}
#bar input[type=range]{width:240px}
#meta{font-size:12px;color:#555}
#stage{padding:8px;overflow:auto;height:calc(100vh - 64px)}
svg{background:#fff;border:1px solid #ddd;cursor:grab;touch-action:none}
svg.dragging{cursor:grabbing}
rect.node{stroke:#333;stroke-width:0.5}
rect.node.frozen{fill:#9cf}
rect.node.live{fill:#fc9}
path.wire{stroke:#888;stroke-width:0.6;fill:none}
path.wire.long{stroke:#bbb;stroke-width:0.4}
rect.group{fill-opacity:0.18;stroke-width:1.5;stroke-opacity:0.85}
rect.stage{fill-opacity:0.07;stroke:none}
text.glabel{font-size:11px;fill:#333;pointer-events:none}
text.slabel{font-size:12px;font-weight:700;fill:#445;pointer-events:none;opacity:0.85}
</style></head><body>
<div id=bar>
  <strong>Density</strong>
  <label>sparse <input id=density type=range min=0 max=100 value=45> tight</label>
  <label><input id=showHierarchy type=checkbox checked> hierarchy</label>
  <label><input id=showWires type=checkbox> wires</label>
  <label><input id=showLongWires type=checkbox> long wires</label>
  <label><input id=showGroups type=checkbox> groups</label>
  <label><input id=showBefore type=checkbox> BEFORE ghost</label>
  <span id=meta></span>
  <span style="font-size:12px;color:#666">Drag orange nodes · __SOURCE__ · solver preview only</span>
</div>
<div id=stage><svg id=svg xmlns="http://www.w3.org/2000/svg"></svg></div>
<script>
const DATA = __DATA__;
const svg = document.getElementById('svg');
const densityEl = document.getElementById('density');
const hierarchyEl = document.getElementById('showHierarchy');
const wiresEl = document.getElementById('showWires');
const longWiresEl = document.getElementById('showLongWires');
const groupsEl = document.getElementById('showGroups');
const beforeEl = document.getElementById('showBefore');
const metaEl = document.getElementById('meta');
const WIRE_HIDE = DATA.wireHide || 720;
let xy = new Float64Array(DATA.n * 2);
let drag = null;
let cam = null;

function lerpStops(t) {
  const stops = DATA.stops;
  const u = Math.max(0, Math.min(1, t)) * (stops.length - 1);
  const i0 = Math.floor(u);
  const i1 = Math.min(stops.length - 1, i0 + 1);
  const f = u - i0;
  const a = stops[i0], b = stops[i1];
  const out = new Float64Array(DATA.n * 2);
  for (let i = 0; i < out.length; i++) out[i] = a.xy[i] * (1 - f) + b.xy[i] * f;
  // Stage ids are discrete — pick the nearer stop.
  const stageSrc = f < 0.5 ? a : b;
  return {
    xy: out,
    col: a.col*(1-f)+b.col*f,
    row: a.row*(1-f)+b.row*f,
    stage: stageSrc.stage || null
  };
}

function bounds(arr) {
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  for (let i=0;i<DATA.n;i++) {
    const x=arr[i*2], y=arr[i*2+1], hw=DATA.w[i]*0.5, hh=DATA.h[i]*0.5;
    minX=Math.min(minX,x-hw); minY=Math.min(minY,y-hh);
    maxX=Math.max(maxX,x+hw); maxY=Math.max(maxY,y+hh);
  }
  return {minX,minY,maxX,maxY,W:maxX-minX,H:maxY-minY};
}

function fit(b) {
  const readable=0.05, f=Math.min(1100/Math.max(1,b.W), 720/Math.max(1,b.H));
  return Math.min(0.2, Math.max(readable, Math.min(f, readable*2)));
}

function groupColor(i) {
  const h = (i * 47) % 360;
  return 'hsl(' + h + ' 55% 45%)';
}

function stageColor(i) {
  const h = (210 + i * 38) % 360;
  return 'hsl(' + h + ' 40% 70%)';
}

function stageTint(i) {
  const h = (25 + i * 28) % 360;
  return 'hsl(' + h + ' 70% 72%)';
}

/** Build stage lanes from solver stage ids, else cluster by X gaps. */
function hierarchyStages(arr, stageIds) {
  if (stageIds && stageIds.length === DATA.n) {
    const map = new Map();
    for (let i = 0; i < DATA.n; i++) {
      const si = stageIds[i] | 0;
      let s = map.get(si);
      if (!s) {
        s = {minX: Infinity, maxX: -Infinity, minY: Infinity, maxY: -Infinity, nodes: [], si};
        map.set(si, s);
      }
      const left = arr[i*2] - DATA.w[i] * 0.5;
      const right = arr[i*2] + DATA.w[i] * 0.5;
      const top = arr[i*2+1] - DATA.h[i] * 0.5;
      const bot = arr[i*2+1] + DATA.h[i] * 0.5;
      s.nodes.push(i);
      s.minX = Math.min(s.minX, left);
      s.maxX = Math.max(s.maxX, right);
      s.minY = Math.min(s.minY, top);
      s.maxY = Math.max(s.maxY, bot);
    }
    return [...map.values()].sort((a, b) => a.si - b.si);
  }
  const xs = [];
  for (let i = 0; i < DATA.n; i++) xs.push({i, x: arr[i*2]});
  xs.sort((a, b) => a.x - b.x);
  const deltas = [];
  for (let i = 1; i < xs.length; i++) deltas.push(xs[i].x - xs[i-1].x);
  deltas.sort((a, b) => a - b);
  const med = deltas.length ? deltas[(deltas.length * 0.55) | 0] : 80;
  const gap = Math.max(90, Math.min(220, med * 2.4));
  const stages = [];
  let cur = null;
  for (const n of xs) {
    const left = n.x - DATA.w[n.i] * 0.5;
    const right = n.x + DATA.w[n.i] * 0.5;
    if (!cur || left - cur.maxX > gap) {
      cur = {minX: left, maxX: right, minY: Infinity, maxY: -Infinity, nodes: []};
      stages.push(cur);
    }
    cur.nodes.push(n.i);
    cur.minX = Math.min(cur.minX, left);
    cur.maxX = Math.max(cur.maxX, right);
    cur.minY = Math.min(cur.minY, arr[n.i*2+1] - DATA.h[n.i] * 0.5);
    cur.maxY = Math.max(cur.maxY, arr[n.i*2+1] + DATA.h[n.i] * 0.5);
  }
  return stages;
}

let currentStages = null;

function applyDensity() {
  const packed = lerpStops(densityEl.value / 100);
  xy = packed.xy;
  currentStages = packed.stage;
  cam = null;
  const b0 = bounds(DATA.before);
  const b1 = bounds(xy);
  const stages = hierarchyStages(xy, currentStages);
  metaEl.textContent = 'gap ~' + packed.col.toFixed(0) + '/' + packed.row.toFixed(0) +
    ' · canvas ' + b1.W.toFixed(0) + 'x' + b1.H.toFixed(0) +
    ' · vs BEFORE W×' + (b1.W/b0.W).toFixed(2) + ' H×' + (b1.H/b0.H).toFixed(2) +
    ' · stages ' + stages.length +
    ' · groups ' + ((DATA.groups && DATA.groups.length) || 0);
  draw();
}

function wirePath(x0, y0, x1, y1, mx, my) {
  const sx = mx(x0), sy = my(y0), tx = mx(x1), ty = my(y1);
  const mid = (sx + tx) * 0.5;
  return 'M' + sx + ' ' + sy + ' C' + mid + ' ' + sy + ',' + mid + ' ' + ty + ',' + tx + ' ' + ty;
}

function drawWires(arr, mx, my, opacityScale) {
  const showLong = longWiresEl.checked;
  let shown = 0, hidden = 0;
  let html = '';
  for (const e of DATA.edges) {
    const a = e[0], c = e[1];
    const x0 = arr[a*2], y0 = arr[a*2+1], x1 = arr[c*2], y1 = arr[c*2+1];
    const len = Math.hypot(x1 - x0, y1 - y0);
    const isLong = len >= WIRE_HIDE;
    if (isLong && !showLong) { hidden++; continue; }
    shown++;
    const op = (isLong ? 0.18 : 0.55) * opacityScale;
    const cls = isLong ? 'wire long' : 'wire';
    html += '<path class="' + cls + '" opacity="' + op + '" d="' + wirePath(x0, y0, x1, y1, mx, my) + '" />';
  }
  return {html, shown, hidden};
}

function draw() {
  const showBefore = beforeEl.checked;
  const showWires = wiresEl.checked;
  const showGroups = groupsEl.checked;
  const showHierarchy = hierarchyEl.checked;
  let b = bounds(xy);
  if (showBefore) {
    const g = bounds(DATA.before);
    b = {
      minX: Math.min(b.minX, g.minX), minY: Math.min(b.minY, g.minY),
      maxX: Math.max(b.maxX, g.maxX), maxY: Math.max(b.maxY, g.maxY),
      W: 0, H: 0
    };
    b.W = b.maxX - b.minX; b.H = b.maxY - b.minY;
  }
  if (!drag || !cam) cam = {b, scale: fit(b)};
  const scale = cam.scale;
  b = cam.b;
  const pad = 20, top = 28;
  svg.setAttribute('width', b.W * scale + pad * 2);
  svg.setAttribute('height', b.H * scale + pad * 2 + top);
  const mx = x => pad + (x - b.minX) * scale;
  const my = y => pad + top + (y - b.minY) * scale;
  let html = '';
  let note = '';
  const stages = hierarchyStages(xy, currentStages);
  const stageOf = new Int16Array(DATA.n);
  if (currentStages && currentStages.length === DATA.n) {
    for (let i = 0; i < DATA.n; i++) stageOf[i] = currentStages[i] | 0;
  } else {
    stages.forEach((s, si) => s.nodes.forEach(i => { stageOf[i] = si; }));
  }

  if (showHierarchy) {
    const gpad = 28;
    stages.forEach((s, si) => {
      const x = mx(s.minX - gpad), y = my(Math.min(s.minY, b.minY) - 8);
      const w = (s.maxX - s.minX + gpad * 2) * scale;
      const h = (Math.max(s.maxY, b.maxY) - Math.min(s.minY, b.minY) + 24) * scale;
      html += '<rect class="stage" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h +
        '" fill="' + stageColor(si) + '" />';
      if (w >= 36) {
        const label = 'Stage ' + ((s.si != null ? s.si : si) + 1);
        html += '<text class="slabel" x="' + (x + Math.min(8, w * 0.08)) + '" y="' + (pad + 14) + '">' + label + '</text>';
      }
    });
    note += ' · stages ' + stages.length;
  }

  if (showBefore) {
    if (showWires) html += drawWires(DATA.before, mx, my, 0.45).html;
    for (let i = 0; i < DATA.n; i++) {
      const rw = Math.max(4, DATA.w[i]*scale), rh = Math.max(4, DATA.h[i]*scale);
      html += '<rect opacity="0.2" x="' + (mx(DATA.before[i*2])-rw/2) + '" y="' + (my(DATA.before[i*2+1])-rh/2) +
        '" width="' + rw + '" height="' + rh + '" fill="#bbb" stroke="#888" />';
    }
  }
  if (showGroups && DATA.groups) {
    const maxSpan = 1200, maxNamedSpan = 3200, gpad = 12;
    let shown = 0, hidden = 0;
    DATA.groups.forEach((g, gi) => {
      let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity, hit=0;
      for (const i of g.m) {
        if (i < 0 || i >= DATA.n) continue;
        hit++;
        const hw=DATA.w[i]*0.5, hh=DATA.h[i]*0.5;
        minX=Math.min(minX, xy[i*2]-hw); minY=Math.min(minY, xy[i*2+1]-hh);
        maxX=Math.max(maxX, xy[i*2]+hw); maxY=Math.max(maxY, xy[i*2+1]+hh);
      }
      if (hit < 2 || !isFinite(minX)) { hidden++; return; }
      const span = Math.hypot(maxX - minX, maxY - minY);
      const named = g.n && g.n.length;
      if (span > (named ? maxNamedSpan : maxSpan)) { hidden++; return; }
      shown++;
      const col = g.c || groupColor(gi);
      const x = mx(minX - gpad), y = my(minY - gpad);
      const w = (maxX - minX + gpad * 2) * scale, h = (maxY - minY + gpad * 2) * scale;
      html += '<rect class="group" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h +
        '" fill="' + col + '" stroke="' + col + '" rx="4" />';
      html += '<text class="glabel" x="' + (x + 4) + '" y="' + (y + 12) + '">' + (named ? g.n : ('G' + gi)) + '</text>';
    });
    if (hidden > 0) note += ' · show ' + shown + '/' + (shown + hidden) + ' groups';
  }
  if (showWires) {
    const w = drawWires(xy, mx, my, 1);
    html += w.html;
    note += ' · wires ' + w.shown + (w.hidden ? ' (hid ' + w.hidden + ' long)' : '');
  }
  if (note) {
    metaEl.textContent = (metaEl.textContent || '')
      .replace(/ · stages \d+| · show \d+\/\d+ groups| · wires \d+( \(hid \d+ long\))?/g, '') + note;
  }
  for (let i = 0; i < DATA.n; i++) {
    const rw = Math.max(5, DATA.w[i]*scale), rh = Math.max(5, DATA.h[i]*scale);
    const frozen = DATA.frozen[i];
    const fill = frozen ? '#9cf' : (showHierarchy ? stageTint(stageOf[i]) : '#fc9');
    const cls = frozen ? 'node frozen' : 'node live';
    html += '<rect class="' + cls + '" data-i="' + i + '" x="' + (mx(xy[i*2])-rw/2) + '" y="' + (my(xy[i*2+1])-rh/2) +
      '" width="' + rw + '" height="' + rh + '" fill="' + fill + '" />';
  }
  svg.innerHTML = html;
  svg._map = {scale};
}

svg.addEventListener('pointerdown', e => {
  const t = e.target;
  if (!(t instanceof SVGRectElement) || !t.classList.contains('live')) return;
  const i = +t.dataset.i;
  drag = {i, x: xy[i*2], y: xy[i*2+1], px: e.clientX, py: e.clientY};
  svg.classList.add('dragging');
  t.setPointerCapture(e.pointerId);
  e.preventDefault();
});
svg.addEventListener('pointermove', e => {
  if (!drag) return;
  const scale = svg._map.scale;
  xy[drag.i*2] = drag.x + (e.clientX - drag.px) / scale;
  xy[drag.i*2+1] = drag.y + (e.clientY - drag.py) / scale;
  draw();
});
function endDrag() { drag = null; svg.classList.remove('dragging'); }
svg.addEventListener('pointerup', endDrag);
svg.addEventListener('pointercancel', endDrag);
densityEl.addEventListener('input', applyDensity);
hierarchyEl.addEventListener('change', draw);
wiresEl.addEventListener('change', draw);
longWiresEl.addEventListener('change', draw);
groupsEl.addEventListener('change', draw);
beforeEl.addEventListener('change', () => { cam = null; draw(); });
applyDensity();
</script>
</body></html>
